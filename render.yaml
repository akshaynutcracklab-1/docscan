# Render Blueprint: free demo deployment of the DocScan backend.
# Render dashboard -> New -> Blueprint -> pick this repo. It creates:
#   docscan-api   free web service built from backend/Dockerfile (gunicorn + Celery worker in one container)
#   docscan-db    free Postgres (Render deletes free databases 30 days after creation)
#   docscan-redis free Key Value (Redis) for the Celery broker and cache
# Free web services sleep after ~15 min idle (first request then takes ~1 min) and their disk is
# wiped on restart, so uploaded page images don't survive a sleep. Fine for testing and demos.
services:
  - type: web
    name: docscan-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: docscan-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: docscan-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # Render terminates HTTPS and already redirects HTTP; Django's redirect would break the health check.
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: SERVE_MEDIA
        value: "True"
      - key: RUN_WORKER_IN_WEB
        value: "True"
      # Sized for the 512 MB free instance.
      - key: GUNICORN_WORKERS
        value: "2"
      - key: CELERY_CONCURRENCY
        value: "1"
      - key: OCR_ENGINE
        value: azure
      - key: DOCINTEL_TIER
        value: F0
      # Entered in the Render dashboard when the Blueprint is created (never committed).
      - key: DOCINTEL_ENDPOINT
        sync: false
      - key: DOCINTEL_KEY
        sync: false

  - type: keyvalue
    name: docscan-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []   # reachable only from your Render services

databases:
  - name: docscan-db
    plan: free
    databaseName: docscan
    user: docscan
